<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réservation | Pure & Power</title><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/pages.css"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"></head><body><header class="page-nav"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">P&P</span> PURE & POWER</a><nav class="page-links"><a href="index.html">Accueil</a><a href="services.html">Services</a><a href="tarifs.html">Tarifs</a><a href="experience.html">Engagement</a><a href="contact.html">Contact</a><a class="active" href="booking.html">Réserver</a><a href="login.html">Espace client</a></nav></div></header><main class="page-main"><div class="container"><div class="hero-mini"><span class="label">Réservation</span><h1>Prendre <span>rendez-vous</span></h1><p>Choisissez votre prestation, votre date et vos coordonnées.</p></div><div class="form-wrap"><form id="bookingForm"><div class="form-grid"><div class="form-group"><label>Prénom</label><input id="firstName" required></div><div class="form-group"><label>Nom</label><input id="lastName" required></div><div class="form-group"><label>Téléphone</label><input id="phone" required></div><div class="form-group"><label>Email</label><input id="email" type="email" required></div><div class="form-group"><label>Prestation</label><select id="service" required><option value="">Choisir...</option><option>Ménage courant — 20 €/h</option><option>Ménage approfondi — 25 €/h</option><option>Nettoyage des vitres — dès 5 €/vitre</option><option>Repassage — sur devis</option><option>Forfait Studio — dès 35 €</option><option>Forfait T2 — dès 45 €</option><option>Forfait T3 — dès 60 €</option></select></div><div class="form-group"><label>Date</label><input id="bookingDate" type="date" required></div><div class="form-group"><label>Horaire</label><select id="bookingTime" required><option value="">Choisir...</option><option>08:00</option><option>10:00</option><option>14:00</option><option>16:00</option><option>18:00</option></select></div><div class="form-group"><label>Ville</label><input id="city" placeholder="Ajaccio" required></div><div class="form-group full"><label>Adresse</label><input id="address" placeholder="Votre adresse" required></div><div class="form-group full"><label>Besoins particuliers</label><textarea id="needs" rows="5" placeholder="Décrivez votre besoin..."></textarea></div></div><div class="form-actions"><button class="btn btn-green" type="submit">Confirmer la demande →</button><a class="btn btn-outline" href="contact.html">Une question ?</a></div><p id="bookingMessage" style="color:#2E6B47;font-weight:700"></p></form></div></div></main><footer class="footer">Pure & Power — Ajaccio • 07 58 29 80 26</footer><script>document.getElementById('bookingForm').addEventListener('submit',e=>{e.preventDefault();localStorage.setItem('purePowerBooking',JSON.stringify({name:document.getElementById('firstName').value+' '+document.getElementById('lastName').value,service:document.getElementById('service').value,date:document.getElementById('bookingDate').value,time:document.getElementById('bookingTime').value,address:document.getElementById('address').value,city:document.getElementById('city').value}));document.getElementById('bookingMessage').textContent='✓ Votre demande a été enregistrée. Merci pour votre confiance.';});</script></body></html>
