name: Build Pure & Power Admin APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'admin_app/**'
      - 'netlify/functions/admin-*.mjs'
      - '.github/workflows/admin-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.0'
          cache: true

      - name: Generate Android platform
        working-directory: admin_app
        run: flutter create --platforms=android --project-name pure_power_admin .

      - name: Get dependencies
        working-directory: admin_app
        run: flutter pub get

      - name: Build release APK
        working-directory: admin_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pure-power-admin-release
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk
