<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confirmation du contrat | Pure & Power</title>
<link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/pages.css"><link rel="stylesheet" href="./css/premium.css">
<style>
.confirm-shell{max-width:760px;margin:70px auto;padding:0 20px}.contract-card{background:#fff;border:1px solid #e2e8e3;border-radius:26px;padding:34px;box-shadow:0 20px 55px rgba(16,42,67,.10)}.contract-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.contract-head h1{margin:5px 0 0}.amount{font-size:34px;font-weight:800;color:#2F6B4F}.details{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:25px 0}.detail{padding:15px;border-radius:14px;background:#f6f8f6}.detail small{display:block;color:#64748b;margin-bottom:5px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.btn-refuse{border:1px solid #c65b5b;background:#fff;color:#a33d3d}.state{padding:15px;border-radius:14px;background:#f6f8f6;font-weight:700;margin-top:20px}@media(max-width:650px){.contract-head{display:block}.details{grid-template-columns:1fr}.amount{margin-top:15px}}
</style>
</head>
<body>
<header class="page-nav"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">P&P</span>PURE & POWER</a><nav class="page-links"><a href="index.html">Accueil</a><a href="services.html">Services</a><a href="contact.html">Contact</a></nav></div></header>
<main class="page-main"><div class="confirm-shell"><div class="hero-mini"><span class="label">Document sécurisé</span><h1>Votre <span>contrat</span></h1><p>Vérifiez les informations ci-dessous puis acceptez ou refusez la proposition.</p></div>
<section class="contract-card" id="card"><div id="loading">Chargement du contrat…</div></section></div></main>
<footer class="footer">Pure & Power • Document client sécurisé</footer>
<script>
(()=>{const card=document.getElementById('card'),token=new URLSearchParams(location.search).get('token');const esc=v=>String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));const date=v=>v?new Date(v+'T00:00:00').toLocaleDateString('fr-FR'): '—';
async function load(){if(!token){card.innerHTML='<div class="state">Lien de contrat invalide.</div>';return}try{const r=await fetch('/.netlify/functions/contract?token='+encodeURIComponent(token));const d=await r.json();if(!r.ok)throw new Error(d.error||'Contrat introuvable');const b=d.booking;const locked=['client_confirmed','client_refused'].includes(b.status);card.innerHTML=`<div class="contract-head"><div><span class="label">Pure & Power</span><h1>Proposition de prestation</h1><p>Référence : ${esc(b.id)}</p></div><div class="amount">${Number(b.total_price||0).toFixed(2)} €</div></div><div class="details"><div class="detail"><small>Client</small><strong>${esc(b.client_first_name)} ${esc(b.client_last_name)}</strong></div><div class="detail"><small>Prestation</small><strong>${esc(b.service)}</strong></div><div class="detail"><small>Date</small><strong>${esc(date(b.booking_date))}</strong></div><div class="detail"><small>Horaire</small><strong>${esc(b.booking_time)}</strong></div><div class="detail"><small>Adresse</small><strong>${esc(b.address)}</strong></div><div class="detail"><small>Quantité / durée</small><strong>${esc(b.quantity)}</strong></div></div><p>Votre demande a été validée par Pure & Power. Le contrat PDF vous a été transmis par email. Votre décision finale peut être enregistrée ci-dessous.</p><div class="actions">${locked?'':'<button id="accept" class="btn btn-green">✓ Accepter le contrat</button><button id="refuse" class="btn btn-refuse">✕ Refuser</button>'}<a class="btn btn-outline" href="index.html">Retour au site</a></div><div id="state" class="state">Statut : ${esc(b.status)}</div>`;if(!locked){document.getElementById('accept').onclick=()=>decide('confirm');document.getElementById('refuse').onclick=()=>decide('refuse')}}catch(e){card.innerHTML='<div class="state">Impossible de charger ce contrat. Vérifiez le lien reçu par email.</div>'}}
async function decide(decision){const buttons=card.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);try{const r=await fetch('/.netlify/functions/contract?token='+encodeURIComponent(token),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Erreur');document.getElementById('state').innerHTML=decision==='confirm'?'✓ Contrat accepté. Merci pour votre confiance.':'Votre demande a été refusée.';if(decision==='confirm')document.getElementById('state').innerHTML+=' <a class="btn btn-green" style="display:inline-block;margin-left:8px" href="payment.html">Passer au paiement</a>';}catch(e){document.getElementById('state').textContent=e.message;buttons.forEach(b=>b.disabled=false)}}load()})();
</script>
</body></html>
