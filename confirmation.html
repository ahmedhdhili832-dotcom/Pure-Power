<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirmation du contrat | Pure & Power</title><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/pages.css"><link rel="stylesheet" href="./css/premium.css"><style>.decision{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:24px}.contract-summary{display:grid;grid-template-columns:1fr 1fr;gap:12px}.contract-summary div{padding:14px;background:#f7f5ef;border-radius:12px}.contract-summary small{display:block;color:#71808b;margin-bottom:5px}@media(max-width:650px){.decision,.contract-summary{grid-template-columns:1fr}}</style></head><body><header class="page-nav"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">P&P</span>PURE & POWER</a><nav class="page-links"><a href="index.html">Accueil</a><a href="services.html">Services</a><a href="dashboard.html">Mon espace</a></nav></div></header><main class="page-main"><div class="container"><div class="hero-mini"><span class="label">Votre contrat</span><h1>Confirmez votre <span>prestation</span></h1><p>Vérifiez les informations ci-dessous avant de confirmer.</p></div><div class="form-wrap"><div id="contract"></div></div></div></main><footer class="footer">Pure & Power • Contrat client</footer><script>const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const id=new URLSearchParams(location.search).get('id');const list=read('purePowerBookings',[]);const b=list.find(x=>x.id===id)||read('purePowerBooking',null);const root=document.getElementById('contract');if(!b){root.innerHTML='<div class="card"><h2>Contrat introuvable</h2><p>Connectez-vous à votre espace client pour retrouver votre demande.</p><a class="btn btn-green" href="dashboard.html">Mon espace</a></div>'}else{const amount=Number(b.price||0)||((b.service||'').includes('Ménage courant')?20:Number((b.service||'').includes('Ménage approfondi')?25:0));root.innerHTML=`<div class="card"><h2>📄 Contrat de prestation</h2><div class="contract-summary"><div><small>Client</small><strong>${esc(b.name)}</strong></div><div><small>Prestation</small><strong>${esc(b.service)}</strong></div><div><small>Date</small><strong>${esc(b.date)}</strong></div><div><small>Horaire</small><strong>${esc(b.time)}</strong></div><div><small>Adresse</small><strong>${esc(b.address)}</strong></div><div><small>Montant</small><strong>${amount.toLocaleString('fr-FR')} €</strong></div></div><p id="msg" style="margin-top:20px">En confirmant, vous acceptez les informations et le montant proposés.</p><div class="decision"><button class="btn btn-green" onclick="confirmContract()">✓ J'accepte le contrat</button><button class="btn btn-outline" onclick="refuseContract()">✕ Je refuse</button></div></div>`}function save(b){const a=read('purePowerBookings',[]);const i=a.findIndex(x=>x.id===b.id);if(i>=0)a[i]=b;localStorage.setItem('purePowerBookings',JSON.stringify(a));localStorage.setItem('purePowerBooking',JSON.stringify(b))}function confirmContract(){b.status='Confirmée par le client';b.contractStatus='Accepté';b.paymentStatus='À payer';save(b);document.getElementById('msg').innerHTML='<strong>✓ Contrat confirmé.</strong> Votre demande est validée et le paiement peut être effectué.';document.querySelector('.decision').innerHTML='<a class="btn btn-green" href="payment.html">💳 Procéder au paiement</a>'}function refuseContract(){b.status='Refusée par le client';b.contractStatus='Refusé';save(b);document.getElementById('msg').innerHTML='<strong>Demande refusée.</strong> Merci. Vous pouvez nous contacter pour une autre proposition.';document.querySelector('.decision').innerHTML='<a class="btn btn-outline" href="contact.html">Contacter Pure & Power</a>'}</script></body></html>
