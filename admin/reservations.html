<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demandes clients | Pure & Power Admin</title><link rel="stylesheet" href="./admin.css"><style>.request-card{padding:22px;margin:18px 0;border:1px solid #e4e9e5;border-radius:18px;background:#fff;box-shadow:0 12px 30px rgba(16,42,67,.07)}.request-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.request-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.request-grid div{background:#f7f5ef;border-radius:12px;padding:12px}.request-grid small{display:block;color:#71808b;margin-bottom:4px}.request-actions{display:flex;gap:10px;flex-wrap:wrap}.approve{background:#2f6b4f;color:#fff;border:0}.reject{background:#fff;color:#a43d3d;border:1px solid #d9a2a2}.price{font-size:25px;font-weight:800;color:#2f6b4f}@media(max-width:700px){.request-grid{grid-template-columns:1fr}.request-head{flex-direction:column}}</style></head><body><div class="admin-shell"><aside class="sidebar"><a class="brand" href="index.html"><span class="mark">P&P</span><span>PURE & POWER</span></a><div class="admin-label">ADMIN</div><nav><a href="index.html">▦ Dashboard</a><a href="clients.html">◉ Clients</a><a class="active" href="reservations.html">◷ Demandes</a><a href="contracts.html">▤ Contrats</a><a href="payments.html">€ Paiements</a><a href="services.html">✦ Services</a><a href="pricing.html">◇ Tarifs</a><a href="calendar.html">□ Calendrier</a><a href="settings.html">⚙ Paramètres</a></nav></aside><main class="main"><div class="topbar"><div><span class="eyebrow">GESTION CLIENT</span><h1>Demandes de prestation</h1></div><a class="visit" href="index.html">← Dashboard</a></div><section id="requests"></section><footer>Pure & Power Admin</footer></main></div><script>
const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const price=b=>{const h=Number(b.hours||b.duration||1);if((b.service||'').includes('Ménage courant'))return 20*h;if((b.service||'').includes('Ménage approfondi'))return 25*h;if((b.service||'').includes('Studio'))return 35;if((b.service||'').includes('T2'))return 45;if((b.service||'').includes('T3'))return 60;return Number(b.price||0)};let list=read('purePowerBookings',[]);const one=read('purePowerBooking',null);if(!list.length&&one)list=[one];const root=document.getElementById('requests');function render(){if(!list.length){root.innerHTML='<div class="panel"><p class="empty">Aucune demande client.</p></div>';return}root.innerHTML=list.slice().reverse().map((b,i)=>{const realIndex=list.length-1-i;const p=price(b);return `<article class="request-card"><div class="request-head"><div><span class="eyebrow">${esc(b.id||'DEMANDE')}</span><h2>${esc(b.name||((b.firstName||'')+' '+(b.lastName||'')).trim()||'Client')}</h2><p>${esc(b.email||'')} · ${esc(b.phone||'')}</p></div><div><small>Montant proposé</small><div class="price">${p.toLocaleString('fr-FR')} €</div><span class="badge">${esc(b.status||'En attente')}</span></div></div><div class="request-grid"><div><small>Prestation</small><strong>${esc(b.service||'—')}</strong></div><div><small>Date / heure</small><strong>${esc(b.date||'—')} · ${esc(b.time||'—')}</strong></div><div><small>Adresse</small><strong>${esc(b.address||'—')}</strong></div><div><small>Ville</small><strong>${esc(b.city||'—')}</strong></div><div><small>Durée</small><strong>${esc(b.hours||b.duration||'1')} h</strong></div><div><small>Besoins</small><strong>${esc(b.needs||'Aucun')}</strong></div></div><div class="request-actions">${b.status==='Acceptée'?'<button class="btn approve" onclick="sendContract('+realIndex+')">📧 Envoyer le contrat par email</button>':'<button class="btn approve" onclick="approve('+realIndex+')">✓ Accepter la demande</button><button class="btn reject" onclick="reject('+realIndex+')">✕ Refuser</button>'}</div></article>`}).join('')};function save(){localStorage.setItem('purePowerBookings',JSON.stringify(list));if(list.length)localStorage.setItem('purePowerBooking',JSON.stringify(list[list.length-1]))}async function approve(i){list[i].status='Acceptée';list[i].contractStatus='Contrat à valider';list[i].paymentStatus='En attente';list[i].approvedAt=new Date().toISOString();save();render();alert('Demande acceptée. Vous pouvez maintenant envoyer le contrat par email.')}function reject(i){list[i].status='Refusée';list[i].contractStatus='Annulé';save();render()}async function sendContract(i){const b=list[i];const amount=price(b);try{const r=await fetch('/.netlify/functions/send-contract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({booking:{...b,price:amount}})});if(!r.ok)throw new Error();alert('Contrat envoyé à '+b.email)}catch(e){const subject=encodeURIComponent('Contrat de prestation — Pure & Power');const body=encodeURIComponent(`Bonjour ${b.name||''},\n\nVotre demande a été acceptée.\nPrestation : ${b.service||''}\nDate : ${b.date||''}\nHoraire : ${b.time||''}\nMontant : ${amount} €\n\nMerci de confirmer votre accord depuis votre espace client.\n\nPure & Power`);window.location.href='mailto:'+encodeURIComponent(b.email||'')+'?subject='+subject+'&body='+body}}render();
</script></body></html>
